<svg xmlns="http://www.w3.org/2000/svg" width="1232" height="520" viewBox="0 0 1232 520" role="img" aria-label="moyu-2048：左边是灰阶棋盘，按 ESC 后变成 git log">
  <title>moyu-2048 演示</title>
  <rect width="1232" height="520" rx="16" fill="#0d1117"/>
  <g>
      <rect x="24" y="24" width="580" height="440" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="24" y="24" width="580" height="32" rx="12" fill="#21262d"/>
      <rect x="24" y="44" width="580" height="12" fill="#21262d"/>
      <circle cx="42" cy="40" r="4.5" fill="#ff5f56"/>
      <circle cx="58" cy="40" r="4.5" fill="#ffbd2e"/>
      <circle cx="74" cy="40" r="4.5" fill="#27c93f"/>
      <text x="94" y="45" font-size="12" fill="#8b949e">moyu-2048 — 摸鱼模式</text>
      <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.0">
      <text x="42" y="144.0" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="600">moyu-2048</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#8b949e">分数</tspan><tspan fill="#c9d1d9"> 1250   </tspan><tspan fill="#8b949e">最高</tspan><tspan fill="#c9d1d9"> 8932</tspan></text>
      <text x="42" y="184.0" xml:space="preserve"><tspan fill="#c9d1d9">+------+------+------+------+</tspan></text>
      <text x="42" y="204.0" xml:space="preserve"><tspan fill="#c9d1d9">|     2</tspan><tspan fill="#c9d1d9">|   128</tspan><tspan fill="#c9d1d9">|</tspan><tspan fill="#8b949e">     .</tspan><tspan fill="#c9d1d9">|     4</tspan><tspan fill="#c9d1d9">|</tspan></text>
      <text x="42" y="224.0" xml:space="preserve"><tspan fill="#c9d1d9">+------+------+------+------+</tspan></text>
      <text x="42" y="244.0" xml:space="preserve"><tspan fill="#c9d1d9">|</tspan><tspan fill="#8b949e">     .</tspan><tspan fill="#c9d1d9">|    16</tspan><tspan fill="#c9d1d9">|     8</tspan><tspan fill="#c9d1d9">|   512</tspan><tspan fill="#c9d1d9">|</tspan></text>
      <text x="42" y="264.0" xml:space="preserve"><tspan fill="#c9d1d9">+------+------+------+------+</tspan></text>
      <text x="42" y="284.0" xml:space="preserve"><tspan fill="#c9d1d9">|     4</tspan><tspan fill="#c9d1d9">|    64</tspan><tspan fill="#c9d1d9">|    32</tspan><tspan fill="#c9d1d9">|     2</tspan><tspan fill="#c9d1d9">|</tspan></text>
      <text x="42" y="304.0" xml:space="preserve"><tspan fill="#c9d1d9">+------+------+------+------+</tspan></text>
      <text x="42" y="324.0" xml:space="preserve"><tspan fill="#c9d1d9">|</tspan><tspan fill="#c9d1d9" font-weight="600">  1024</tspan><tspan fill="#c9d1d9">|     8</tspan><tspan fill="#c9d1d9">|</tspan><tspan fill="#8b949e">     .</tspan><tspan fill="#c9d1d9">|     2</tspan><tspan fill="#c9d1d9">|</tspan></text>
      <text x="42" y="344.0" xml:space="preserve"><tspan fill="#c9d1d9">+------+------+------+------+</tspan></text>
      <text x="42" y="384.0" xml:space="preserve"><tspan fill="#8b949e">方向键 / WASD 移动   u 撤销   n 新局   ESC 伪装   q 退出</tspan></text>
      </g>
    </g>
  <g>
      <rect x="628" y="24" width="580" height="440" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="628" y="24" width="580" height="32" rx="12" fill="#21262d"/>
      <rect x="628" y="44" width="580" height="12" fill="#21262d"/>
      <circle cx="646" cy="40" r="4.5" fill="#ff5f56"/>
      <circle cx="662" cy="40" r="4.5" fill="#ffbd2e"/>
      <circle cx="678" cy="40" r="4.5" fill="#27c93f"/>
      <text x="698" y="45" font-size="12" fill="#8b949e">PowerShell — git log</text>
      <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.0">
      <text x="646" y="94.0" xml:space="preserve"><tspan fill="#c9d1d9">$ git log --oneline --stat -4</tspan></text>
      <text x="646" y="114.0" xml:space="preserve"><tspan fill="#c9d1d9">a3f9c21 fix(order): skip empty refund batch</tspan></text>
      <text x="646" y="134.0" xml:space="preserve"><tspan fill="#8b949e"> order/service.py      | 18 +++++++++------</tspan></text>
      <text x="646" y="154.0" xml:space="preserve"><tspan fill="#8b949e"> order/refund_test.py  |  9 ++++---</tspan></text>
      <text x="646" y="174.0" xml:space="preserve"><tspan fill="#8b949e"> 2 files changed, 16 insertions(+), 11 deletions(-)</tspan></text>
      <text x="646" y="214.0" xml:space="preserve"><tspan fill="#c9d1d9">7c2e104 chore(deps): bump requests to 2.32.3</tspan></text>
      <text x="646" y="234.0" xml:space="preserve"><tspan fill="#8b949e"> requirements.txt      |  2 +-</tspan></text>
      <text x="646" y="254.0" xml:space="preserve"><tspan fill="#8b949e"> 1 file changed, 1 insertion(+), 1 deletion(-)</tspan></text>
      <text x="646" y="294.0" xml:space="preserve"><tspan fill="#c9d1d9">d81b0ef refactor: extract retry policy into helper</tspan></text>
      <text x="646" y="314.0" xml:space="preserve"><tspan fill="#8b949e"> core/retry.py         | 42 +++++++++++++++++++-------</tspan></text>
      <text x="646" y="334.0" xml:space="preserve"><tspan fill="#8b949e"> core/retry_test.py    | 27 ++++++++++++++++++</tspan></text>
      <text x="646" y="354.0" xml:space="preserve"><tspan fill="#8b949e"> 3 files changed, 58 insertions(+), 11 deletions(-)</tspan></text>
      <text x="646" y="394.0" xml:space="preserve"><tspan fill="#c9d1d9">$ </tspan></text>
      <text x="646" y="434.0" xml:space="preserve"><tspan fill="#8b949e">  [esc]</tspan></text>
      </g>
    </g>
  <text x="314.0" y="498" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b949e" text-anchor="middle">← 摸鱼模式，默认灰阶，远看只是数字 →</text>
  <text x="918.0" y="498" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8b949e" text-anchor="middle">← 按 ESC：一键伪装成工作画面 →</text>
</svg>
